# Local-only uBiblio for a Raspberry Pi.
# The app and Redis are not published to the host. Caddy is the only listener.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  ubiblio:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEV: "false"
      USE_REDIS: "true"
      LOCAL_ONLY: "true"
      COOKIE_SECURE: "true"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DB_LOCATION: /app/config/sql_app.db
      SECRET_KEY_FILE: /app/config/secret_key.txt
      SIGNING_KEY_FILE: /app/config/sign_key.txt
      VERIFY_KEY_FILE: /app/config/verify_key.txt
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ubiblio_config:/app/config
    networks:
      - internal
      - web
    depends_on:
      - redis
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - ubiblio
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  web:

volumes:
  ubiblio_config:
  caddy_data:
  caddy_config:
